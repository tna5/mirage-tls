# Microsoft Edge (Chromium). Same network stack as Chrome; differs by brand and UA.

[meta]
family = "edge"
default_major = 157
min_major = 131
default_platform = "windows"
verified = false
notes = "Chrome network fingerprint with Edge brand list and UA."

[vars]
brand = "Microsoft Edge"
ua_os = "Windows NT 10.0; Win64; x64"
ch_platform = '"Windows"'
ch_mobile = "?0"
ua = "Mozilla/5.0 ({ua_os}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/{major}.0.0.0 Safari/537.36 Edg/{major}.0.0.0"

[tls]
min_version = "1.2"
max_version = "1.3"
ciphers = [
  "TLS_AES_128_GCM_SHA256",
  "TLS_AES_256_GCM_SHA384",
  "TLS_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
  "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
  "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
  "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA",
  "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
  "TLS_RSA_WITH_AES_128_GCM_SHA256",
  "TLS_RSA_WITH_AES_256_GCM_SHA384",
  "TLS_RSA_WITH_AES_128_CBC_SHA",
  "TLS_RSA_WITH_AES_256_CBC_SHA",
]
curves = ["X25519MLKEM768", "X25519", "P-256", "P-384"]
sigalgs = [
  "mldsa44",
  "mldsa65",
  "mldsa87",
  "ecdsa_secp256r1_sha256",
  "rsa_pss_rsae_sha256",
  "rsa_pkcs1_sha256",
  "ecdsa_secp384r1_sha384",
  "rsa_pss_rsae_sha384",
  "rsa_pkcs1_sha384",
  "rsa_pss_rsae_sha512",
  "rsa_pkcs1_sha512",
]
alpn = ["h2", "http/1.1"]
sigalgs_grease = true
trust_anchors = ""
alps = ["h2"]
alps_new_codepoint = true
grease = true
permute_extensions = true
ech_grease = true
cert_compression = ["brotli"]
ocsp_stapling = true
signed_cert_timestamps = true

[http2]
settings = [[1, 65536], [2, 0], [4, 6291456], [6, 262144]]
window_update = 15663105
pseudo_header_order = ["m", "a", "s", "p"]
headers_priority = { weight = 256, depends_on = 0, exclusive = true }

[headers]
default = [
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["accept-language", "en-US,en;q=0.9"],
  ["upgrade-insecure-requests", "1"],
  ["user-agent", "{ua}"],
  ["accept", "text/html,application/xhtml+xml,application/xml;q=0.9,image/jxl,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"],
  ["sec-fetch-site", "none"],
  ["sec-fetch-mode", "navigate"],
  ["sec-fetch-user", "?1"],
  ["sec-fetch-dest", "document"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["priority", "u=0, i"],
]
order = [
  "host", "connection", "content-length", "cache-control", "sec-ch-ua", "sec-ch-ua-mobile",
  "sec-ch-ua-platform", "accept-language", "origin", "content-type", "upgrade-insecure-requests",
  "user-agent", "accept", "sec-fetch-site", "sec-fetch-mode", "sec-fetch-user", "sec-fetch-dest",
  "referer", "accept-encoding", "cookie", "priority",
]
h1_case = [
  "Host", "Connection", "Content-Length", "Cache-Control", "Origin", "Content-Type",
  "Upgrade-Insecure-Requests", "User-Agent", "Accept", "Sec-Fetch-Site", "Sec-Fetch-Mode",
  "Sec-Fetch-User", "Sec-Fetch-Dest", "Referer", "Accept-Encoding", "Accept-Language", "Cookie",
]

# ---------------------------------------------------------------------------------------
# Request modes. Only the navigation headers above were verified against a capture
# (Chrome 157 macOS). The modes below follow Chrome's well-known subresource layout
# (client hints split around user-agent, fetch-metadata, priority per resource type) but
# have NOT been verified against a capture of this version.
# sec-fetch-site / origin / referer values are computed per request (see fetch.rs).

# fetch() / XMLHttpRequest from a page.
[headers.modes.fetch]
verified = false
default = [
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["user-agent", "{ua}"],
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["accept", "*/*"],
  ["sec-fetch-site", "same-origin"],
  ["sec-fetch-mode", "cors"],
  ["sec-fetch-dest", "empty"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["accept-language", "en-US,en;q=0.9"],
  ["priority", "u=1, i"],
]
order = [
  "host", "connection", "content-length", "pragma", "cache-control", "sec-ch-ua-platform",
  "user-agent", "sec-ch-ua", "content-type", "sec-ch-ua-mobile", "accept", "origin",
  "sec-fetch-site", "sec-fetch-mode", "sec-fetch-dest", "referer", "accept-encoding",
  "accept-language", "cookie", "priority",
]

# <img>
[headers.modes.image]
verified = false
default = [
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["user-agent", "{ua}"],
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["accept", "image/jxl,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"],
  ["sec-fetch-site", "same-origin"],
  ["sec-fetch-mode", "no-cors"],
  ["sec-fetch-dest", "image"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["accept-language", "en-US,en;q=0.9"],
  ["priority", "i"],
]
order = [
  "host", "connection", "content-length", "pragma", "cache-control", "sec-ch-ua-platform",
  "user-agent", "sec-ch-ua", "content-type", "sec-ch-ua-mobile", "accept", "origin",
  "sec-fetch-site", "sec-fetch-mode", "sec-fetch-dest", "referer", "accept-encoding",
  "accept-language", "cookie", "priority",
]

# <script src> (classic, render-blocking)
[headers.modes.script]
verified = false
default = [
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["user-agent", "{ua}"],
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["accept", "*/*"],
  ["sec-fetch-site", "same-origin"],
  ["sec-fetch-mode", "no-cors"],
  ["sec-fetch-dest", "script"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["accept-language", "en-US,en;q=0.9"],
  ["priority", "u=1"],
]
order = [
  "host", "connection", "content-length", "pragma", "cache-control", "sec-ch-ua-platform",
  "user-agent", "sec-ch-ua", "content-type", "sec-ch-ua-mobile", "accept", "origin",
  "sec-fetch-site", "sec-fetch-mode", "sec-fetch-dest", "referer", "accept-encoding",
  "accept-language", "cookie", "priority",
]

# <link rel=stylesheet>
[headers.modes.style]
verified = false
default = [
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["user-agent", "{ua}"],
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["accept", "text/css,*/*;q=0.1"],
  ["sec-fetch-site", "same-origin"],
  ["sec-fetch-mode", "no-cors"],
  ["sec-fetch-dest", "style"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["accept-language", "en-US,en;q=0.9"],
  ["priority", "u=0"],
]
order = [
  "host", "connection", "content-length", "pragma", "cache-control", "sec-ch-ua-platform",
  "user-agent", "sec-ch-ua", "content-type", "sec-ch-ua-mobile", "accept", "origin",
  "sec-fetch-site", "sec-fetch-mode", "sec-fetch-dest", "referer", "accept-encoding",
  "accept-language", "cookie", "priority",
]

# Document loaded in an <iframe>: navigation headers, no user activation.
[headers.modes.iframe]
verified = false
set = [["sec-fetch-dest", "iframe"]]
remove = ["sec-fetch-user"]

[platforms.windows]

[platforms.macos.vars]
ua_os = "Macintosh; Intel Mac OS X 10_15_7"
ch_platform = '"macOS"'

# Chrome 131-156: layout without ML-DSA sigalgs, GREASE sigalg and trust_anchors.
# (Exact version where each change landed is not verified.)
[before.157.tls]
sigalgs_grease = false
trust_anchors = ""
sigalgs = [
  "ecdsa_secp256r1_sha256",
  "rsa_pss_rsae_sha256",
  "rsa_pkcs1_sha256",
  "ecdsa_secp384r1_sha384",
  "rsa_pss_rsae_sha384",
  "rsa_pkcs1_sha384",
  "rsa_pss_rsae_sha512",
  "rsa_pkcs1_sha512",
]

[before.157.headers]
default = [
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["upgrade-insecure-requests", "1"],
  ["user-agent", "{ua}"],
  ["accept", "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"],
  ["sec-fetch-site", "none"],
  ["sec-fetch-mode", "navigate"],
  ["sec-fetch-user", "?1"],
  ["sec-fetch-dest", "document"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["accept-language", "en-US,en;q=0.9"],
  ["priority", "u=0, i"],
]
order = [
  "host", "connection", "content-length", "cache-control", "sec-ch-ua", "sec-ch-ua-mobile",
  "sec-ch-ua-platform", "origin", "content-type", "upgrade-insecure-requests", "user-agent", "accept",
  "sec-fetch-site", "sec-fetch-mode", "sec-fetch-user", "sec-fetch-dest", "referer",
  "accept-encoding", "accept-language", "cookie", "priority",
]

[before.157.headers.modes.image]
default = [
  ["sec-ch-ua-platform", "{ch_platform}"],
  ["user-agent", "{ua}"],
  ["sec-ch-ua", "{sec_ch_ua}"],
  ["sec-ch-ua-mobile", "{ch_mobile}"],
  ["accept", "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"],
  ["sec-fetch-site", "same-origin"],
  ["sec-fetch-mode", "no-cors"],
  ["sec-fetch-dest", "image"],
  ["accept-encoding", "gzip, deflate, br, zstd"],
  ["accept-language", "en-US,en;q=0.9"],
  ["priority", "i"],
]

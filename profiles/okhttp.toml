# OkHttp (most native Android apps) on Android's Conscrypt (BoringSSL).

[meta]
family = "okhttp"
default_major = 5
min_major = 4
max_major = 5
default_platform = "android"
verified = false
notes = "OkHttp 4.x/5.x MODERN_TLS spec on Android. Verify against a real capture."

[vars]
ua = "okhttp/{major}.0.0"

[tls]
min_version = "1.2"
max_version = "1.3"
ciphers = [
  "TLS_AES_128_GCM_SHA256",
  "TLS_AES_256_GCM_SHA384",
  "TLS_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
  "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
  "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
  "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA",
  "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
  "TLS_RSA_WITH_AES_128_GCM_SHA256",
  "TLS_RSA_WITH_AES_256_GCM_SHA384",
  "TLS_RSA_WITH_AES_128_CBC_SHA",
  "TLS_RSA_WITH_AES_256_CBC_SHA",
]
curves = ["X25519", "P-256", "P-384"]
sigalgs = [
  "ecdsa_secp256r1_sha256",
  "rsa_pss_rsae_sha256",
  "rsa_pkcs1_sha256",
  "ecdsa_secp384r1_sha384",
  "rsa_pss_rsae_sha384",
  "rsa_pkcs1_sha384",
  "rsa_pss_rsae_sha512",
  "rsa_pkcs1_sha512",
  "rsa_pkcs1_sha1",
]
alpn = ["h2", "http/1.1"]
grease = false
permute_extensions = false
extension_order = [
  "server_name",
  "extended_master_secret",
  "renegotiate",
  "supported_groups",
  "ec_point_formats",
  "session_ticket",
  "application_layer_protocol_negotiation",
  "status_request",
  "signature_algorithms",
  "key_share",
  "psk_key_exchange_modes",
  "supported_versions",
  "padding",
]
ocsp_stapling = true

[http2]
settings = [[4, 16777216]]
window_update = 16711681
pseudo_header_order = ["m", "p", "a", "s"]

[headers]
default = [
  ["accept-encoding", "gzip"],
  ["user-agent", "{ua}"],
]
order = ["host", "content-type", "content-length", "connection", "accept-encoding", "cookie", "user-agent"]

[platforms.android]

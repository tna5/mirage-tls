# Release: push a tag `v<version>` matching crates/mirage-napi/package.json "version".
# Builds all targets, publishes the single `mirage-tls` package to npm with every
# prebuilt .node binary inside (native.js picks the one for the current OS / arch),
# and creates a GitHub release with the binaries attached. Needs the NPM_TOKEN secret (granular token, publish).
# No --provenance: npm only accepts it from a public repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      run-tests: true

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: crates/mirage-napi
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: npm ci
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: crates/mirage-napi/artifacts

      - name: Put the binaries next to native.js
        run: |
          cp artifacts/bindings-*/mirage-tls.*.node .
          ls -l mirage-tls.*.node

      # prepublishOnly checks that every binary listed in "files" is present, and
      # prepack copies README.md / LICENSE / THIRD_PARTY_NOTICES.md from the root.
      - name: Publish mirage-tls
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "mirage-tls@$version" version >/dev/null 2>&1; then
            echo "::error::mirage-tls@$version is already published"
            exit 1
          fi
          npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: crates/mirage-napi/mirage-tls.*.node

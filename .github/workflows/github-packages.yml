# Publishes the package to GitHub Packages as @tna5/mirage-tls (GitHub's npm registry
# only accepts names scoped to the repository owner), so it is listed under the
# repository's "Packages". The .node binaries are taken from the GitHub release of the
# tag: nothing is rebuilt. Called by release.yml; can also be run by hand for an
# existing release (Actions > GitHub Packages > Run workflow).
name: GitHub Packages

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.1)
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @${{ github.repository_owner }}/mirage-tls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mirage-napi
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'

      - name: Download the binaries of the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'mirage-tls.*.node' --dir .
          ls -l mirage-tls.*.node

      - name: Scope the package name for GitHub Packages
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          npm pkg set "name=@$owner/mirage-tls" "publishConfig.registry=https://npm.pkg.github.com"
          npm pkg delete publishConfig.access

      # prepublishOnly checks that the five binaries are present; prepack copies
      # README.md / LICENSE / THIRD_PARTY_NOTICES.md from the repository root.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on GitHub Packages, skipping"
            exit 0
          fi
          npm publish
